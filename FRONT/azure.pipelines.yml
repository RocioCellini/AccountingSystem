trigger:
  branches:
    exclude:
      - '*' 

pr:
  branches:
    include:
      - dev 
      - int
      - uat
      - master

jobs:
- job: Test
  displayName: 'Run tests'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '14.x'
      displayName: 'Install Node.js'

    - script: npm ci
      displayName: 'Install dependencies'

    - script: |
        jest --clearCache
        npm test --all || (echo "Tests not found. Failing the pipeline." && exit 1)
      displayName: 'Run tests'
